<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Ретро-Клуб</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #111;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }
        #game-container {
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>
    <div id="game-container">
        <div id="game"></div>
    </div>

    <!-- Загрузчик EmulatorJS -->
    <script>
        // Получаем имя игры и платформу из URL параметров
        const urlParams = new URLSearchParams(window.location.search);
        const system = urlParams.get('system') || 'nes'; // nes (Денди) или sega (Mega Drive)
        const romUrl = urlParams.get('rom') || '';

        window.EJS_player = '#game';
        window.EJS_core = system === 'sega' ? 'segaMD' : 'nes';
        window.EJS_gameUrl = romUrl; // Прямая ссылка на .nes или .bin/.gen файл
        window.EJS_pathtodata = 'https://cdn.emulatorjs.org/stable/data/';
        window.EJS_startOnLoaded = true;

        // Растягиваем Web App на весь экран Telegram
        if (window.Telegram && window.Telegram.WebApp) {
            window.Telegram.WebApp.ready();
            window.Telegram.WebApp.expand();
        }
    </script>
    <script src="https://cdn.emulatorjs.org/stable/data/loader.js"></script>
</body>
</html>
